function TransferabilityBadge({ level }) {
  const cat = IP_CATEGORIES[level];
  return (
    <span style={{
      display: "inline-block", padding: "3px 10px", borderRadius: "4px", fontSize: "11px",
      fontWeight: 700, letterSpacing: "0.5px", textTransform: "uppercase",
      color: cat.color, background: cat.bg, border: `1px solid ${cat.color}33`,
    }}>{cat.label}</span>
  );
}

function LegalBadge({ status }) {
  const s = LEGAL_STATUS[status];
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: "4px", padding: "2px 8px", borderRadius: "4px",
      fontSize: "11px", fontWeight: 600, color: s.color, background: `${s.color}15`, border: `1px solid ${s.color}25`,
    }}>{s.icon} {s.label}</span>
  );
}

function FitBar({ value, small }) {
  const h = small ? 6 : 10;
  const color = value >= 75 ? "#22c55e" : value >= 50 ? "#eab308" : value >= 30 ? "#f97316" : "#ef4444";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px", minWidth: small ? 80 : 120 }}>
      <div style={{ flex: 1, height: h, background: "#1a1a2e", borderRadius: h/2, overflow: "hidden" }}>
        <div style={{ width: `${value}%`, height: "100%", background: color, borderRadius: h/2, transition: "width 0.4s ease" }} />
      </div>
      <span style={{ fontSize: small ? 10 : 11, fontWeight: 700, color, minWidth: 28, textAlign: "right" }}>{value}%</span>
    </div>
  );
}

function HeatCell({ value, notes, onClick }) {
  const color = value >= 75 ? "#22c55e" : value >= 50 ? "#eab308" : value >= 30 ? "#f97316" : "#ef4444";
  const opacity = Math.max(0.15, value / 100 * 0.7);
  return (
    <td onClick={onClick} title={notes} style={{
      padding: "6px 4px", textAlign: "center",
      background: `${color}${Math.round(opacity * 255).toString(16).padStart(2, "0")}`,
      color, fontWeight: 700, fontSize: "11px", cursor: "pointer",
      borderBottom: "1px solid #1a1a2e", borderRight: "1px solid #1a1a2e", transition: "all 0.2s",
    }}>{value}</td>
  );
}

function DashboardView({ onSelectProduct }) {
  const totalProducts = WORK_PRODUCTS.length;
  const highTransfer = WORK_PRODUCTS.filter(p => p.transferability === "HIGH").length;
  const needsRenego = WORK_PRODUCTS.filter(p => p.legalStatus === "RENEGOTIATE").length;
  const generic = WORK_PRODUCTS.filter(p => p.legalStatus === "GENERIC").length;
  const assigned = WORK_PRODUCTS.filter(p => p.legalStatus === "ASSIGNED").length;
  const parseRevRange = (s) => { const m = s.match(/\$([\d.]+)M/g); if (!m) return [0, 0]; const vals = m.map(v => parseFloat(v.replace("$", "").replace("M", ""))); return vals.length === 2 ? vals : [vals[0], vals[0]]; };
  const transferable = WORK_PRODUCTS.filter(p => p.transferability === "HIGH" || p.transferability === "MEDIUM");
  const revLow = transferable.reduce((s, p) => s + parseRevRange(p.revenue)[0], 0);
  const revHigh = transferable.reduce((s, p) => s + parseRevRange(p.revenue)[1], 0);

  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "12px", marginBottom: "24px" }}>
        {[
          { label: "Work Products", value: totalProducts, sub: `${highTransfer} high transferability`, color: "#22c55e" },
          { label: "Revenue Potential", value: `$${revLow.toFixed(1)}\u2013${revHigh.toFixed(1)}M`, sub: "transferable IP ARR", color: "#818cf8" },
          { label: "Legal Status", value: `${generic} Generic`, sub: `${needsRenego} need renegotiation`, color: "#eab308" },
          { label: "Locked IP", value: assigned, sub: "assigned to Novamera", color: "#ef4444" },
        ].map((card, i) => (
          <div key={i} style={{ background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "16px" }}>
            <div style={{ fontSize: "11px", color: "#6b7280", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "8px" }}>{card.label}</div>
            <div style={{ fontSize: "24px", fontWeight: 800, color: card.color, fontFamily: "'JetBrains Mono', monospace" }}>{card.value}</div>
            <div style={{ fontSize: "11px", color: "#9ca3af", marginTop: "4px" }}>{card.sub}</div>
          </div>
        ))}
      </div>

      <div style={{ marginBottom: "24px" }}>
        <h3 style={{ fontSize: "13px", color: "#9ca3af", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "12px" }}>Work Product Portfolio</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
          {WORK_PRODUCTS.map(p => {
            const avgFit = Math.round(Object.values(p.industries).reduce((s, v) => s + v.fit, 0) / Object.keys(p.industries).length);
            return (
              <div key={p.id} onClick={() => onSelectProduct(p.id)} style={{
                background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px 16px",
                cursor: "pointer", transition: "all 0.2s", display: "grid",
                gridTemplateColumns: "1fr auto auto auto", alignItems: "center", gap: "16px",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = "#333"; e.currentTarget.style.background = "#111128"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "#1a1a2e"; e.currentTarget.style.background = "#0d0d1a"; }}>

        <h3 style={{ fontSize: "13px", color: "#9ca3af", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "12px" }}>\u26a0\ufe0f Key Legal Findings</h3>
        <div style={{ fontSize: "12px", color: "#d1d5db", lineHeight: 1.7 }}>
          <p style={{ marginBottom: "10px" }}>The Propel\u2013Novamera MSA assigns <strong style={{ color: "#ef4444" }}>all Work Product to Novamera</strong> except narrow "Generic Work Product." The Generic Work Product carve-out requires: (a) general application, (b) <em>no mining-related application</em>, and (c) no Novamera Confidential Info.</p>
          <p style={{ marginBottom: "10px" }}>Condition (b) is the critical blocker \u2014 since Propel's thesis is "AI for mining," nearly everything has mining application. Only pure infrastructure code (data pipelines, QC engines, upload portals) may qualify as Generic.</p>
          <p style={{ marginBottom: "0" }}><strong style={{ color: "#eab308" }}>Recommendation:</strong> Renegotiate MSA to add "Propel Platform IP" category covering generalizable frameworks. Alternatively, ensure Background Technology is explicitly listed in each Development Plan before starting work.</p>
        </div>
      </div>
    </div>
  );
}

function HeatmapView({ onSelectProduct }) {
  const [tooltip, setTooltip] = useState(null);
  return (
    <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "11px" }}>
        <thead>
          <tr>
            <th style={{ textAlign: "left", padding: "8px 6px", color: "#6b7280", fontSize: "10px", textTransform: "uppercase", letterSpacing: "0.5px", borderBottom: "2px solid #1a1a2e", position: "sticky", left: 0, background: "#09090f", zIndex: 1, minWidth: 160 }}>Work Product</th>
            {INDUSTRIES.map(ind => (
              <th key={ind.id} style={{ padding: "6px 2px", color: "#6b7280", fontSize: "9px", textTransform: "uppercase", letterSpacing: "0.3px", borderBottom: "2px solid #1a1a2e", textAlign: "center", minWidth: 52, maxWidth: 70, whiteSpace: "normal", lineHeight: 1.2 }}>
                <span style={{ fontSize: "14px" }}>{ind.icon}</span><br />{ind.name}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {WORK_PRODUCTS.map(p => (
            <tr key={p.id}>
              <td onClick={() => onSelectProduct(p.id)} style={{ padding: "8px 6px", fontWeight: 600, color: "#d1d5db", borderBottom: "1px solid #1a1a2e", cursor: "pointer", position: "sticky", left: 0, background: "#09090f", zIndex: 1, fontSize: "11px" }}>{p.name}</td>
              {INDUSTRIES.map(ind => (
                <HeatCell key={ind.id} value={p.industries[ind.id]?.fit || 0} notes={p.industries[ind.id]?.notes || ""} onClick={() => setTooltip(tooltip?.pid === p.id && tooltip?.iid === ind.id ? null : { pid: p.id, iid: ind.id })} />
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      {tooltip && (() => {
        const p = WORK_PRODUCTS.find(x => x.id === tooltip.pid);
        const ind = INDUSTRIES.find(x => x.id === tooltip.iid);
        const data = p?.industries[tooltip.iid];
        return (
          <div style={{ marginTop: "12px", background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px" }}>
            <div style={{ fontSize: "13px", fontWeight: 700, color: "#e5e7eb", marginBottom: "4px" }}>{ind.icon} {p.name} \u2192 {ind.name}</div>
            <FitBar value={data.fit} />
            <div style={{ fontSize: "12px", color: "#9ca3af", marginTop: "6px" }}>{data.notes}</div>
          </div>
        );
      })()}
    </div>
  );
}

function ProductDetailView({ productId, onBack }) {
  const p = WORK_PRODUCTS.find(x => x.id === productId);
  if (!p) return null;
  const sorted = INDUSTRIES.map(ind => ({ ...ind, ...p.industries[ind.id] })).sort((a, b) => b.fit - a.fit);
  const mining = sorted.filter(x => x.sector === "Mining");
  const adjacent = sorted.filter(x => x.sector === "Adjacent");

  return (
    <div>
      <button onClick={onBack} style={{ background: "none", border: "1px solid #333", color: "#9ca3af", padding: "4px 12px", borderRadius: "4px", cursor: "pointer", fontSize: "11px", marginBottom: "16px" }}>\u2190 Back</button>
      <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "8px", flexWrap: "wrap" }}>
        <h2 style={{ fontSize: "18px", fontWeight: 800, color: "#e5e7eb", margin: 0 }}>{p.name}</h2>
        <TransferabilityBadge level={p.transferability} />
        <LegalBadge status={p.legalStatus} />
      </div>
      <div style={{ fontSize: "11px", color: "#6b7280", marginBottom: "16px" }}>{p.category} \u00b7 {p.techStack} \u00b7 {p.effort}</div>
      <p style={{ fontSize: "12px", color: "#d1d5db", lineHeight: 1.7, marginBottom: "20px" }}>{p.description}</p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "16px", marginBottom: "20px" }}>
        <div style={{ background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px" }}>
          <h4 style={{ fontSize: "11px", color: "#6b7280", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "10px", marginTop: 0 }}>Transferable Components</h4>
          {p.components.map((c, i) => (
            <div key={i} style={{ fontSize: "12px", color: "#d1d5db", padding: "4px 0", borderBottom: i < p.components.length - 1 ? "1px solid #111" : "none" }}>
              <span style={{ color: "#22c55e", marginRight: "6px" }}>\u25c6</span>{c}
            </div>
          ))}
        </div>
        <div style={{ background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px" }}>
          <h4 style={{ fontSize: "11px", color: "#6b7280", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "10px", marginTop: 0 }}>Novamera-Specific (Non-Transferable)</h4>
          <p style={{ fontSize: "12px", color: "#ef4444", lineHeight: 1.6, margin: 0 }}>{p.novameraSpecific}</p>
          <div style={{ marginTop: "12px", padding: "10px", background: "#111", borderRadius: "6px" }}>
            <div style={{ fontSize: "10px", color: "#6b7280", textTransform: "uppercase", marginBottom: "4px" }}>Est. Revenue Potential</div>
            <div style={{ fontSize: "16px", fontWeight: 800, color: "#818cf8", fontFamily: "'JetBrains Mono', monospace" }}>{p.revenue}</div>
          </div>
        </div>
      </div>

      <h3 style={{ fontSize: "13px", color: "#9ca3af", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "12px" }}>Industry Fit Analysis</h3>
      {[{ label: "Mining Tech Companies", data: mining }, { label: "Adjacent Industries", data: adjacent }].map(group => (
        <div key={group.label} style={{ marginBottom: "16px" }}>
          <div style={{ fontSize: "11px", color: "#6b7280", marginBottom: "8px", fontWeight: 700 }}>{group.label}</div>
          {group.data.map(ind => (
            <div key={ind.id} style={{ display: "grid", gridTemplateColumns: "140px 140px 1fr", alignItems: "center", gap: "12px", padding: "8px 0", borderBottom: "1px solid #111" }}>
              <div style={{ fontSize: "12px", color: "#d1d5db" }}>{ind.icon} {ind.name}</div>
              <FitBar value={ind.fit} />
              <div style={{ fontSize: "11px", color: "#9ca3af" }}>{ind.notes}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function IndustryView() {
  const [selectedIndustry, setSelectedIndustry] = useState(null);
  if (selectedIndustry) {
    const ind = INDUSTRIES.find(x => x.id === selectedIndustry);
    const products = WORK_PRODUCTS.map(p => ({ ...p, fit: p.industries[selectedIndustry]?.fit || 0, notes: p.industries[selectedIndustry]?.notes || "" })).sort((a, b) => b.fit - a.fit);
    const avgFit = Math.round(products.reduce((s, p) => s + p.fit, 0) / products.length);
    const highFit = products.filter(p => p.fit >= 70).length;
    return (
      <div>
        <button onClick={() => setSelectedIndustry(null)} style={{ background: "none", border: "1px solid #333", color: "#9ca3af", padding: "4px 12px", borderRadius: "4px", cursor: "pointer", fontSize: "11px", marginBottom: "16px" }}>\u2190 Back</button>
        <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "16px" }}>
          <span style={{ fontSize: "28px" }}>{ind.icon}</span>
          <div>
            <h2 style={{ fontSize: "18px", fontWeight: 800, color: "#e5e7eb", margin: 0 }}>{ind.name}</h2>
            <div style={{ fontSize: "11px", color: "#6b7280" }}>{ind.sector} \u00b7 {highFit} high-fit products \u00b7 Avg fit: {avgFit}%</div>
          </div>
        </div>
        {products.map(p => (
          <div key={p.id} style={{ background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px 16px", marginBottom: "8px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "6px" }}>
              <div style={{ fontSize: "13px", fontWeight: 700, color: "#e5e7eb" }}>{p.name}</div>
              <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                <LegalBadge status={p.legalStatus} />
                <TransferabilityBadge level={p.transferability} />
              </div>
            </div>
            <FitBar value={p.fit} />
            <div style={{ fontSize: "11px", color: "#9ca3af", marginTop: "6px" }}>{p.notes}</div>
          </div>
        ))}
      </div>
    );
  }
  return (
    <div>
      {["Mining", "Adjacent"].map(sector => (
        <div key={sector} style={{ marginBottom: "20px" }}>
          <h3 style={{ fontSize: "13px", color: "#9ca3af", textTransform: "uppercase", letterSpacing: "1px", marginBottom: "12px" }}>
            {sector === "Mining" ? "\u26cf\ufe0f Mining Tech Companies" : "\ud83c\udfd7\ufe0f Adjacent Industries"}
          </h3>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: "8px" }}>
            {INDUSTRIES.filter(i => i.sector === sector).map(ind => {
              const avgFit = Math.round(WORK_PRODUCTS.reduce((s, p) => s + (p.industries[ind.id]?.fit || 0), 0) / WORK_PRODUCTS.length);
              const highFit = WORK_PRODUCTS.filter(p => (p.industries[ind.id]?.fit || 0) >= 70).length;
              return (
                <div key={ind.id} onClick={() => setSelectedIndustry(ind.id)} style={{
                  background: "#0d0d1a", border: "1px solid #1a1a2e", borderRadius: "8px", padding: "14px", cursor: "pointer", transition: "all 0.2s",
                }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "#333"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#1a1a2e"; }}>
                  <div style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" }}>
                    <span style={{ fontSize: "20px" }}>{ind.icon}</span>
                    <div style={{ fontSize: "13px", fontWeight: 700, color: "#e5e7eb" }}>{ind.name}</div>
                  </div>
                  <FitBar value={avgFit} />
                  <div style={{ fontSize: "10px", color: "#6b7280", marginTop: "4px" }}>{highFit} products with \u226570% fit</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── MAIN APP ───────────────────────────────────────────────────────────────

const TABS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "heatmap", label: "Heatmap" },
  { id: "industries", label: "Industries" },
  { id: "strategy", label: "Strategy" },
];

function App() {
  const [activeTab, setActiveTab] = useState("dashboard");
  const [selectedProduct, setSelectedProduct] = useState(null);
  const handleSelectProduct = (id) => { setSelectedProduct(id); setActiveTab("detail"); };

  return (
    <div style={{ fontFamily: "'IBM Plex Sans', -apple-system, sans-serif", background: "#09090f", color: "#e5e7eb", minHeight: "100vh", padding: "24px" }}>
      <div style={{ maxWidth: 1100, margin: "0 auto" }}>
        <div style={{ marginBottom: "24px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "4px" }}>
            <div style={{ width: 32, height: 32, borderRadius: "6px", background: "linear-gradient(135deg, #818cf8, #6366f1)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "16px", fontWeight: 800, color: "#fff" }}>IP</div>
            <h1 style={{ fontSize: "20px", fontWeight: 800, color: "#e5e7eb", margin: 0 }}>Novamera IP Transferability Agent</h1>
          </div>
          <p style={{ fontSize: "12px", color: "#6b7280", margin: "4px 0 0 42px" }}>
            Analyzing {WORK_PRODUCTS.length} work products across {INDUSTRIES.length} target industries \u00b7 Propel Labs \u2192 Market Opportunity
          </p>
        </div>

        <div style={{ display: "flex", gap: "2px", marginBottom: "20px", background: "#0d0d1a", borderRadius: "8px", padding: "3px", border: "1px solid #1a1a2e" }}>
          {TABS.map(tab => (
            <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedProduct(null); }} style={{
              flex: 1, padding: "8px 16px", border: "none", borderRadius: "6px", fontSize: "12px", fontWeight: 600, cursor: "pointer", transition: "all 0.2s",
              background: activeTab === tab.id ? "#1a1a2e" : "transparent", color: activeTab === tab.id ? "#e5e7eb" : "#6b7280",
            }}>{tab.label}</button>
          ))}
        </div>

        {activeTab === "dashboard" && <DashboardView onSelectProduct={handleSelectProduct} />}
        {activeTab === "heatmap" && <HeatmapView onSelectProduct={handleSelectProduct} />}
        {activeTab === "industries" && <IndustryView />}
        {activeTab === "strategy" && <StrategyView />}
        {activeTab === "detail" && selectedProduct && <ProductDetailView productId={selectedProduct} onBack={() => setActiveTab("dashboard")} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
